<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #svg-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 4px;
    }
    svg {
      width: 100%;
      height: 100%;
      max-height: 100%;
      display: block;
      touch-action: manipulation;
    }
    /* Interactive region layers */
    g[data-region] {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: filter 0.22s ease-in-out, transform 0.22s ease-in-out, opacity 0.22s ease-in-out;
    }
    g[data-region]:active {
      transform: scale(0.985);
      transform-origin: center;
    }

    /* Dim other regions slightly when one is highlighted for maximum focus */
    body.has-selection g[data-region]:not(.highlighted) {
      opacity: 0.65;
      filter: saturate(0.85);
    }

    /* VIBRANT GLOWING HIGHLIGHT EFFECT */
    g[data-region].highlighted {
      opacity: 1 !important;
      transform: scale(1.015);
      transform-origin: center;
      filter: drop-shadow(0 0 14px rgba(15, 103, 254, 0.85)) drop-shadow(0 0 4px rgba(59, 130, 246, 0.95));
    }
    g[data-region].highlighted path {
      fill: url(#grad-highlight-bright) !important;
      stroke: #0F67FE !important;
      stroke-width: 2.2px !important;
      stroke-linejoin: round !important;
      transition: fill 0.22s ease-in-out, stroke 0.22s ease-in-out;
    }
    g[data-region].highlighted path[fill*="grad-deep"],
    g[data-region].highlighted path[fill*="grad-mid"] {
      fill: url(#grad-highlight-glow) !important;
      stroke: #0843C6 !important;
    }
    g[data-region].highlighted path[fill="#1e293b"] {
      fill: #0843C6 !important;
      stroke: #0F67FE !important;
    }
  </style>
</head>

  <script>
    let activeRegion = null;

    function highlightRegion(regionId, regionName, fromApp) {
      const groups = document.querySelectorAll('g[data-region]');
      const body = document.body;

      if (activeRegion === regionId && !fromApp) {
        // Tap same region again to toggle off
        activeRegion = null;
        groups.forEach(g => g.classList.remove('highlighted'));
        body.classList.remove('has-selection');
        if (window.AndroidBridge && window.AndroidBridge.onRegionSelected) {
          window.AndroidBridge.onRegionSelected('', '');
        }
        return;
      }

      activeRegion = regionId;
      if (regionId) {
        body.classList.add('has-selection');
        groups.forEach(g => {
          if (g.getAttribute('data-region') === regionId) {
            g.classList.add('highlighted');
          } else {
            g.classList.remove('highlighted');
          }
        });
      } else {
        body.classList.remove('has-selection');
        groups.forEach(g => g.classList.remove('highlighted'));
      }

      if (!fromApp && window.AndroidBridge && window.AndroidBridge.onRegionSelected) {
        window.AndroidBridge.onRegionSelected(regionId || '', regionName || '');
      }
    }

    function clearAllHighlights() {
      activeRegion = null;
      document.body.classList.remove('has-selection');
      document.querySelectorAll('g[data-region]').forEach(g => g.classList.remove('highlighted'));
    }

    document.addEventListener('DOMContentLoaded', () => {
      const groups = document.querySelectorAll('g[data-region]');
      groups.forEach(g => {
        g.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          const rId = g.getAttribute('data-region');
          const rName = g.getAttribute('data-name') || rId;
          highlightRegion(rId, rName, false);
        });
      });
    });
  </script>
